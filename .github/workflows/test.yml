name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.12.0'
            python: '3.11'
          - os: ubuntu-latest
            node: '24'
            python: '3.14'
          - os: macos-latest
            node: '24'
            python: '3.14'
          - os: windows-latest
            node: '24'
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: combicode-js/package-lock.json
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Synchronize package assets
        shell: bash
        run: bash scripts/sync-assets.sh
      - run: npm ci --ignore-scripts
        working-directory: combicode-js
      - run: npm run format:check
        working-directory: combicode-js
      - run: npm test
        working-directory: combicode-js
      - run: python -m pip install -e "./combicode-py[test]" build==1.6.1
      - run: python -m pytest -q combicode-py
      - run: python -m ruff check --config combicode-py/pyproject.toml combicode-py scripts
      - run: python -m ruff format --check --config combicode-py/pyproject.toml combicode-py scripts
      - run: python -m build combicode-py
      - run: npm pack --dry-run
        working-directory: combicode-js
