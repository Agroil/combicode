name: Publish Python Package to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/combicode
    permissions:
      contents: read
      id-token: write # this is required for trusted publishing
    defaults:
      run:
        working-directory: ./combicode-py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Sync shared assets into package
        run: |
          bash scripts/sync-assets.sh
        working-directory: . # Run from root

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip build==1.6.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install JavaScript test dependencies
        run: npm ci --ignore-scripts
        working-directory: ./combicode-js

      - name: Run Tests
        run: |
          pip install ".[test]"
          pytest

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./combicode-py/dist/
