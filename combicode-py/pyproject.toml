[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "combicode"
dynamic = ["version"]
authors = [{ name = "A. Aurelions" }]
description = "A CLI tool to combine a project's codebase into a single file for LLM context with expanded code map."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]
dependencies = ["click>=8.5.0", "pathspec>=1.1.1"]

[project.urls]
Homepage = "https://github.com/aaurelions/combicode"
"Bug Tracker" = "https://github.com/aaurelions/combicode/issues"

[project.scripts]
combicode = "combicode.main:cli"

[tool.setuptools.dynamic]
version = { attr = "combicode.__version__" }

[project.optional-dependencies]
test = ["pytest>=9.1.1", "ruff>=0.16.7"]

[tool.setuptools.package-data]
combicode = ["ignore.json"]

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
